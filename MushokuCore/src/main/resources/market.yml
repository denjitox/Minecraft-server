# market.yml — catalogo del mercado de administracion.
#
# La moneda son diamantes fisicos del inventario del jugador. No hay Vault, ni saldo
# virtual, ni venta al mercado en esta version: el mercado solo vende.
#
# Estructura:
#   titulo: nombre de la pantalla principal
#   categories.<id>:
#     title:         nombre visible en el icono
#     icon:          material del icono en el menu principal
#     slot:          0..26, posicion en el menu principal
#     items.<id>:
#       material:        material de Bukkit, en MAYUSCULAS o minusculas
#       amount:          cantidad que recibe el jugador
#       price-diamonds:  diamantes que cuesta la oferta completa
#       name:            opcional, nombre visible
#       lore:            opcional, lista de lineas
#       biomes:          opcional, lista de biomas donde la oferta esta disponible
#                        (ej: [desert, badlands]). Si falta o esta vacio: disponible en todos.
#                        El nombre se compara en minusculas (se aceptan "minecraft:desert" o "desert").
#       rotation:        opcional, rotacion deterministica (sin estado en BD)
#         period: daily | weekly   (dia/semana UTC)
#         every:  N                  (activa 1 de cada N periodos; 1 = siempre)
#         offset: K                  (opcional; si falta se deriva del id del item)
#
# Reglas de carga:
#   - amount y price-diamonds tienen que ser mayores que 0; si no, la oferta se omite
#     y queda un warning en el log.
#   - amount no puede superar el stack del material (1 en herramientas, escudo,
#     estofado y demas items no apilables): si lo supera, la oferta se omite. Para
#     entregar mas de un stack, cargar varias ofertas.
#   - una categoria muestra hasta 45 ofertas (los slots 45 a 53 son relleno y botones).
#   - el precio es por la oferta completa, no por unidad.
#   - Disponibilidad: una oferta con biomes/rotation solo se muestra y se puede comprar
#     si cumple AMBAS condiciones para el jugador (bioma actual y periodo activo).
#   - /mercado recargar relee este archivo sin reiniciar.

