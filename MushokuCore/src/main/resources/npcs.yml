# npcs.yml — definiciones de los vecinos.
#
# Las skins NO van aca: el script docs/perugius/skins/generar_skins.ps1 descarga los
# PNG, calcula el base64 y escribe npcs-skins.yml junto a este archivo. Si una entrada
# tiene skin.value en este YAML, ese valor gana sobre npcs-skins.yml.
#
# Estructura por NPC:
#   nombre:    nombre visible sobre la entidad
#   titulo:    descripcion de la entidad (Mannequin); en el aldeano de respaldo no se usa
#   skin:
#     value:     base64 de la propiedad "textures" (opcional)
#     signature: firma de la propiedad (opcional, solo si se subio a Mineskin)
#   dialogo:
#     baja / neutral / alta: listas de lineas segun la reputacion del jugador
#   regalos:   material + cantidad que se consume, reputacion que suma y cooldown
#   trueques:  lo que entrega a cambio de un costo en materiales
#
# Las coordenadas NO van aca. Se guardan en npcs-locations.yml al usar
# /vecino colocar <id>, para poder mover el catalogo sin tocar el mundo.

npcs:

  perugius:
    nombre: "&6&lPerugius Dola"
    titulo: "&7Señor de la Fortaleza Celestial"
    dialogo:
      baja:
        - "&7Aún no has demostrado nada. Retírate."
      neutral:
        - "&7La fortaleza no se abre para cualquiera."
        - "&7Habla con los espíritus. Ellos juzgan antes que yo."
      alta:
        - "&6Bienvenido otra vez. Los espíritus hablan bien de ti."
    regalos:
      - id: lingote-oro
        material: GOLD_INGOT
        cantidad: 4
        reputacion: 2
        cooldown-horas: 24
    trueques:
      - id: manzana-dorada
        entrega: GOLDEN_APPLE
        entrega-cantidad: 1
        costo: GOLD_INGOT
        costo-cantidad: 8

  orsted:
    nombre: "&8&lOrsted"
    titulo: "&7Dios Dragón"
    dialogo:
      baja:
        - "&7No tengo nada que decirte."
      neutral:
        - "&7El camino largo es el único que conozco."
        - "&7Si vienes a pedir algo, sé breve."
      alta:
        - "&8Pocos llegan hasta acá. Lo tendré en cuenta."
    regalos:
      - id: perla-ender
        material: ENDER_PEARL
        cantidad: 2
        reputacion: 3
        cooldown-horas: 24
    trueques:
      - id: ender-eye
        entrega: ENDER_EYE
        entrega-cantidad: 1
        costo: ENDER_PEARL
        costo-cantidad: 2

  recepcion:
    nombre: "&fRecepción"
    titulo: "&7Mayordomo de la fortaleza"
    dialogo:
      baja:
        - "&7El registro no tiene tu nombre. No puedo dejarte pasar."
      neutral:
        - "&7Anoto tu visita. Es protocolo."
        - "&7Los invitados esperan en el recibidor."
      alta:
        - "&7Su visita está anotada, como siempre."
    regalos:
      - id: papel
        material: PAPER
        cantidad: 16
        reputacion: 2
        cooldown-horas: 12
    trueques:
      - id: libro
        entrega: BOOK
        entrega-cantidad: 1
        costo: PAPER
        costo-cantidad: 8
      - id: pan
        entrega: BREAD
        entrega-cantidad: 8
        costo: WHEAT
        costo-cantidad: 16

  dragonknight:
    nombre: "&bCaballero Dragón"
    titulo: "&7Espíritu guardián"
    dialogo:
      baja:
        - "&7No te acerques a la puerta."
      neutral:
        - "&7La guardia no descansa."
        - "&7Si buscas pelea, la encontrarás."
      alta:
        - "&bPuedes pasar. Yo respondo."
    regalos:
      - id: hierro
        material: IRON_INGOT
        cantidad: 8
        reputacion: 2
        cooldown-horas: 24
    trueques:
