        costo-cantidad: 4

  spiritknight:
    nombre: "&8Espíritu de Grieta"
    titulo: "&7Espíritu guardián"
    dialogo:
      baja:
        - "&7Tu presencia molesta."
      neutral:
        - "&7La piedra recuerda cada paso."
      alta:
        - "&8La grieta te deja pasar."
    regalos:
      - id: carbon
        material: COAL
        cantidad: 16
        reputacion: 1
        cooldown-horas: 12
    trueques:
      - id: antorcha
        entrega: TORCH
        entrega-cantidad: 16
        costo: COAL
        costo-cantidad: 2

  knight-rojo:
    nombre: "&cCaballero Rojo"
    titulo: "&7Espíritu guardián"
    dialogo:
      baja:
        - "&cAléjate."
      neutral:
        - "&cEl rojo avisa. No hace falta repetirlo."
