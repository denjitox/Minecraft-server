        entrega: SMOOTH_STONE
        entrega-cantidad: 16
        costo: STONE
        costo-cantidad: 16

  sylphiette:
    nombre: "&a&lSylphiette"
    titulo: "&7Maga de la corte"
    dialogo:
      baja:
